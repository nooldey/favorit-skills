interface:
  display_name: "CEM Feedback 研发投入统计"
  short_description: "按飞书项目视图统计 feedback 回收与关联研发工时"
  default_prompt: "先使用 $cem-feishu-project-basic 优化输入，再使用 $cem-feishu-project-feedback-stats 统计指定飞书项目视图中 feedback 回收情况及关联 Story/Task 的研发投入。"

dependencies:
  tools:
    - type: "mcp"
      value: "FeishuProjectMcp"
      description: "读取飞书项目视图、工作项、关联关系和工时字段"

policy:
  allow_implicit_invocation: true
